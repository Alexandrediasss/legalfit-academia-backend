<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Professores</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <nav>
        <a href="/">Início</a>
        <a href="/alunos">Alunos</a>
        <a href="/professores">Professores</a>
        <a href="/treinos">Treinos</a>
        <a href="/exercicios">Exercícios</a>
    </nav>
    <h1>Professores</h1>
    <a href="/professores/novo">Adicionar Novo Professor</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CREF</th>
                <th>Especialidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="professor : ${professores}">
                <td th:text="${professor.id}"></td>
                <td th:text="${professor.nome}"></td>
                <td th:text="${professor.cref}"></td>
                <td th:text="${professor.especialidade}"></td>
                <td>
                    <a th:href="@{/professores/editar/{id}(id=${professor.id})}">Editar</a>
                    <a th:href="@{/professores/excluir/{id}(id=${professor.id})}"
                       onclick="return confirm('Tem certeza? Os treinos desse professor também serão excluídos.')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
