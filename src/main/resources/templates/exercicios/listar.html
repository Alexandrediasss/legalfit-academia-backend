<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercícios - LegalFit</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <header class="topo">
        <a href="/" class="logo">LegalFit<span>Recepção</span></a>
        <nav>
            <a href="/alunos">Alunos</a>
            <a href="/professores">Professores</a>
            <a href="/treinos">Treinos</a>
            <a href="/exercicios" class="ativo">Exercícios</a>
        </nav>
    </header>

    <main>
        <div class="cabecalho-pagina">
            <div>
                <h1>Exercícios</h1>
                <p class="subtitulo">Os exercícios que compõem cada treino</p>
            </div>
            <a href="/exercicios/novo" class="botao">+ Novo exercício</a>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Exercício</th>
                        <th>Séries</th>
                        <th>Repetições</th>
                        <th>Carga (kg)</th>
                        <th>Treino</th>
                        <th>Aluno</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="exercicio : ${exercicios}">
                        <td th:text="${exercicio.id}"></td>
                        <td th:text="${exercicio.nome}"></td>
                        <td th:text="${exercicio.series}"></td>
                        <td th:text="${exercicio.repeticoes}"></td>
                        <td th:text="${exercicio.carga}"></td>
                        <td th:text="${exercicio.treino.nome}"></td>
                        <td th:text="${exercicio.treino.aluno.nome}"></td>
                        <td>
                            <a th:href="@{/exercicios/editar/{id}(id=${exercicio.id})}" class="link-editar">Editar</a>
                            <a th:href="@{/exercicios/excluir/{id}(id=${exercicio.id})}" class="link-excluir"
                               onclick="return confirm('Tem certeza?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(exercicios)}">
                        <td colspan="8" class="vazio">Nenhum exercício cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
