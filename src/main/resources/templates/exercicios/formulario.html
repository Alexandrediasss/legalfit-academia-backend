<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${exercicio.id} == null ? 'Novo Exercício' : 'Editar Exercício'"></title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <h1 th:text="${exercicio.id} == null ? 'Novo Exercício' : 'Editar Exercício'"></h1>
    <form th:action="@{/exercicios/salvar}" th:object="${exercicio}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="nome">Nome:</label>
        <input type="text" th:field="*{nome}" id="nome" placeholder="Ex.: Supino reto" />
        <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error"></span>
        <br>

        <label for="series">Séries:</label>
        <input type="number" th:field="*{series}" id="series" placeholder="Ex.: 4" />
        <span th:if="${#fields.hasErrors('series')}" th:errors="*{series}" class="error"></span>
        <br>

        <label for="repeticoes">Repetições:</label>
        <input type="number" th:field="*{repeticoes}" id="repeticoes" placeholder="Ex.: 12" />
        <span th:if="${#fields.hasErrors('repeticoes')}" th:errors="*{repeticoes}" class="error"></span>
        <br>

        <label for="carga">Carga (kg):</label>
        <input type="number" step="0.5" th:field="*{carga}" id="carga" placeholder="Ex.: 20" />
        <span th:if="${#fields.hasErrors('carga')}" th:errors="*{carga}" class="error"></span>
        <br>

        <label for="treino">Treino:</label>
        <select th:field="*{treino}" id="treino">
            <option value="">Selecione um treino</option>
            <option th:each="t : ${treinos}" th:value="${t.id}"
                    th:text="${t.nome + ' (' + t.aluno.nome + ')'}"></option>
        </select>
        <span th:if="${#fields.hasErrors('treino')}" th:errors="*{treino}" class="error"></span>
        <br><br>

        <input type="submit" value="Salvar" />
        <a href="/exercicios">Cancelar</a>
    </form>
</body>
</html>
